<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Academic Personal & Career Profiling System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Student Profiling System</h4>
        <p class="text-muted small">Academic, Personal & Career Mentoring Portal</p>
      </div>

      <div id="loginErrorAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="usernameInput" class="form-label">Username / Register Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="usernameInput" placeholder="e.g. faculty or 24BCS246" required autocomplete="username">
          </div>
          <div class="form-text small">Faculty use username/email. Students use Register Number.</div>
        </div>

        <div class="mb-4">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <div class="mt-4 pt-3 border-top">
        <div class="small fw-bold text-muted mb-2 text-center text-uppercase" style="letter-spacing: 0.5px; font-size: 0.75rem;">
          Quick Demo Login
        </div>
        <div class="d-flex gap-2">
          <button type="button" id="demoFacultyBtn" class="btn btn-outline-primary btn-sm w-50">
            <i class="bi bi-person-badge me-1"></i>Faculty Demo
          </button>
          <button type="button" id="demoStudentBtn" class="btn btn-outline-secondary btn-sm w-50">
            <i class="bi bi-backpack me-1"></i>Student Demo
          </button>
        </div>
      </div>

      <div class="mt-4 text-center">
        <p class="text-muted" style="font-size: 0.78rem;">
          <i class="bi bi-shield-check text-success me-1"></i>Role-Based Authorization & Privacy-Preserved Mentoring
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
